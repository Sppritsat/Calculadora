version: '3.8'

services:
  # 1. TU SERVIDOR WEB (PHP + Apache)
  web:
    build: .
    container_name: apache_calculadora
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8081:8081"
    volumes:
      # Sincronización de carpetas de código
      - ./api:/var/www/html/api
      - ./js:/var/www/html/js
      - ./style:/var/www/html/style
      - ./bin:/var/www/html/bin
      - ./index.html:/var/www/html/index.html
      # Volumen para librerías (opcional, si lo necesitas)
      - vendor-data:/var/www/html/vendor
    networks:
      - mi_red
    depends_on:
      - db

  # 2. LA NUEVA BASE DE DATOS (ORACLE XE)
  db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle_db
    environment:
      ORACLE_PASSWORD: admin1234
      APP_USER: usuario_finanzas
      APP_USER_PASSWORD: admin1234
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - mi_red

  # 3. RESPALDO (DESACTIVADO PARA ORACLE)
  # Lo comentamos porque mysqldump no sirve aquí.
  # cron_backup:
  #   image: alpine:3.19
  #   ... (código comentado) ...

# 4. DEFINICIÓN DE VOLÚMENES Y REDES (¡ESTO FALTABA!)
volumes:
  oracle-data:
  vendor-data:

networks:
  mi_red:
    driver: bridge


